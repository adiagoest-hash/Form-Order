<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Pengisian Data Order</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background-color: #0b57d0; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
    button:hover { background-color: #0842a0; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <h2>Form Input Data Order</h2>
  
  <form id="orderForm">
    <div class="form-group">
      <label for="namaAgen">Nama Agen (SP):</label>
      <input type="text" id="namaAgen" required>
    </div>
    
    <div class="form-group">
      <label for="namaCustomer">Nama Customer (SH):</label>
      <input type="text" id="namaCustomer" required>
    </div>
    
    <div class="form-group">
      <label for="rencanaKebutuhan">Rencana Kebutuhan Besok (KL):</label>
      <input type="number" id="rencanaKebutuhan" required>
    </div>

    <div class="form-group">
  <label for="plant">Plant:</label>
  <select id="plant" required>
    <option value="" disabled selected>-- Pilih Plant --</option>
    <option value="Samarinda">Samarinda</option>
    <option value="Palaran">Palaran</option>
    <option value="Pendingin">Pendingin</option>
    <option value="Sanga-sanga">Sanga-sanga</option>
  </select>
</div>

    <div class="form-group">
      <label for="nomorSO">Nomor SO:</label>
      <input type="text" id="nomorSO" required>
    </div>

    <div class="form-group">
      <label for="nomorLO">Nomor LO:</label>
      <input type="text" id="nomorLO" required>
    </div>

    <div class="form-group">
      <label for="TanggalAlir">Tanggal Alir:</label>
      <input type="text" id="nomorLO" required>
    </div>
    
    <button type="submit" id="submitBtn">Kirim Data</button>
  </form>

  <p id="status"></p>

  <script>
    // TEMPELKAN URL WEB APP ANDA DI SINI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzi5TjaGHcFs1F0oLp2cYTRhnWNuxlBf-jAO8z9HN87z6OA4CA7nLYqql3hOKvmDguT/exec'; 

    const form = document.getElementById('orderForm');
    const statusText = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      statusText.innerText = 'Mengirim data...';
      statusText.style.color = 'black';

      const payload = {
        namaAgen: document.getElementById('namaAgen').value,
        namaCustomer: document.getElementById('namaCustomer').value,
        rencanaKebutuhan: document.getElementById('rencanaKebutuhan').value,
        plant: document.getElementById('plant').value,
        nomorSO: document.getElementById('nomorSO').value,
        nomorLO: document.getElementById('nomorLO').value
      };

      fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusText.innerText = 'Data berhasil masuk ke Google Sheets!';
        statusText.style.color = 'green';
        form.reset();
        submitBtn.disabled = false;
      })
      .catch(error => {
        statusText.innerText = 'Gagal mengirim data.';
        statusText.style.color = 'red';
        console.error('Error!', error.message);
        submitBtn.disabled = false;
      });
    });
  </script>

</body>
</html>
